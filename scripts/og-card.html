<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@500;600&display=swap">
<style>
  body { margin: 0; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: radial-gradient(120% 140% at 20% 0%, #1a1740 0%, #0d1024 55%, #05060f 100%);
    font-family: "Cormorant Garamond", Georgia, serif; }
  .star { position: absolute; border-radius: 50%; background: #cfc8f0; }
  .neb { position: absolute; width: 560px; height: 560px; border-radius: 50%; filter: blur(90px); opacity: .5; }
  .titulo { position: absolute; left: 80px; top: 140px; font-size: 80px; font-weight: 700; color: #f5ecd8; line-height: 1.04; letter-spacing: .01em; }
  .sub { position: absolute; left: 82px; top: 330px; font-family: "Inter", sans-serif; font-size: 27px; color: #b9b2dd; max-width: 620px; line-height: 1.45; }
  .eyebrow { position: absolute; left: 84px; top: 96px; font-family: "Inter", sans-serif; font-size: 19px; font-weight: 600; letter-spacing: .28em; color: #d8c98a; text-transform: uppercase; }
  .linha { position: absolute; left: 0; right: 0; top: 520px; height: 3px;
    background: linear-gradient(90deg, transparent, #f0d060 20%, #e8608f 55%, #6b64a8 85%, transparent); opacity: .9; }
  .dot { position: absolute; top: 505px; width: 33px; height: 33px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fffaf0, #f0d060 55%, #7a5f1e 100%); box-shadow: 0 0 30px 8px rgba(240,208,96,.5); }
  .orbes { position: absolute; right: 70px; top: 96px; display: grid; grid-template-columns: repeat(3, 108px); gap: 26px; }
  .orbe { width: 108px; height: 108px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(216,201,138,.8);
    background: radial-gradient(circle at 35% 30%, #efe9ff, #6b64a8 58%, #362f5e 100%); box-shadow: 0 6px 22px rgba(0,0,0,.5), 0 0 18px rgba(107,100,168,.5); }
  .orbe img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="neb" style="left:-160px; top:-180px; background: radial-gradient(circle, #4a3a8a, transparent 70%);"></div>
  <div class="neb" style="right:-140px; bottom:-220px; background: radial-gradient(circle, #5a2a4a, transparent 70%);"></div>
  <div class="star" style="left:9%; top:14%; width:4px; height:4px;"></div>
  <div class="star" style="left:30%; top:8%; width:3px; height:3px;"></div>
  <div class="star" style="left:52%; top:18%; width:4px; height:4px;"></div>
  <div class="star" style="left:44%; top:70%; width:3px; height:3px;"></div>
  <div class="star" style="left:12%; top:78%; width:4px; height:4px;"></div>
  <div class="star" style="left:88%; top:60%; width:3px; height:3px;"></div>
  <div class="star" style="left:70%; top:76%; width:4px; height:4px;"></div>
  <span class="eyebrow">Génesis ao Apocalipse</span>
  <div class="titulo">Quem é Quem<br>na Bíblia</div>
  <div class="sub">As personagens da Bíblia numa linha do tempo interativa — árvores de família, histórias e contexto, para a catequese.</div>
  <div class="orbes">
    <span class="orbe"><img src="assets/retratos/abraao.svg" alt=""></span>
    <span class="orbe"><img src="assets/retratos/maria.svg" alt=""></span>
    <span class="orbe"><img src="assets/retratos/moises.svg" alt=""></span>
    <span class="orbe"><img src="assets/retratos/rute.svg" alt=""></span>
    <span class="orbe"><img src="assets/retratos/david.svg" alt=""></span>
    <span class="orbe"><img src="assets/retratos/pedro.svg" alt=""></span>
  </div>
  <div class="linha"></div>
  <div class="dot" style="left:140px;"></div>
  <div class="dot" style="left:560px; transform: scale(.72); opacity:.85;"></div>
  <div class="dot" style="left:940px; transform: scale(.85); opacity:.9;"></div>
</div>
</body>
</html>
